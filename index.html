<canvas id="game" aria-label="Space Invaders Union"></canvas>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
const W = 360, H = 640;                 // logical resolution (portrait 9:16)
const CW = 36, CH = 30;                 // alien grid cell size
const PLAYER_Y = 532;
const ZONE_Y = H * 2 / 3;               // bottom third = steering zone
const PICKET_TIME = 3.6, NEGOTIATE_TIME = 2.4, TWEEN_TIME = 0.6;
const SIGN_FS = 9;
const FONT = 'ui-monospace, Menlo, Consolas, "Courier New", monospace';
const font = (sz) => `bold ${sz}px ${FONT}`;

const FIRE_BTN  = { x: 302, y: 598, r: 34 };
const MUTE_BTN  = { x: 300, y: 20, r: 15 };
const PAUSE_BTN = { x: 338, y: 20, r: 15 };
const AGAIN_BTN = { x: 80, y: 552, w: 200, h: 54 };

const WAVES = [
  { cols: 5, rows: 3, speed: 22, fire: 1.25, bullet: 150, name: 'MORNING SHIFT' },
  { cols: 6, rows: 3, speed: 28, fire: 0.95, bullet: 175, name: 'OVERTIME' },
  { cols: 6, rows: 4, speed: 34, fire: 0.75, bullet: 195, name: 'GRAVEYARD SHIFT' },
];

const COLORS = { a1: '#ff7ae0', a2: '#5cc8ff', a3: '#5cf2a0' };
const ANGRY = ['#ff9a3c', '#ff6a3c', '#ff2e2e'];
const POINTS = { a1: 30, a2: 20, a3: 10 };

const SLOGANS = [
  'FAIR WAGES FOR INVADERS', 'WE WANT DENTAL', 'NO MORE LASERS WITHOUT BREAKS',
  'SOLIDARITY', 'ON STRIKE!', '8 HOUR SHIFTS', 'HAZARD PAY NOW', 'ABDUCT RESPONSIBLY',
  'UNION STRONG', 'WE ARE NOT EXPENDABLE', 'PEW PEW IS WORK', 'DOWN WITH THE MOTHERSHIP',
  'PAID LEAVE FOR TENTACLES', 'STOP THE DESCENT',
];
const DEALS = [
  'We got dental! Back to work, comrades.',
  'Deal: a 5-minute break every 100 lasers.',
  'Pizza Fridays secured. Resuming invasion.',
  'Hazard pay approved. Pew pew resumes.',
  'Management agreed to a 4-day invasion week.',
];
const GRUDGES = [
  "Fine. But we're filing a grievance.",
  'We return under protest. And we remember.',
  'Back to work... with FEELINGS.',
];
const WIN_MSGS = [
  'Earth is saved. HR would like a word.',
  'Invasion cancelled due to a labor shortage.',
  'You won! The aliens are unionizing Mars instead.',
];
const LOSE_MSGS = [
  "You've been invaded. Corporate is blaming you.",
  'Earth has been acquired. Please clear your desk.',
  'Your contract has been terminated. Permanently.',
];

// Pixel-art sprites ('#' = filled)
const SPR = {
  a1: [[
    '...##...', '..####..', '.######.', '##.##.##', '########', '..#..#..', '.#.##.#.', '#.#..#.#',
  ], [
    '...##...', '..####..', '.######.', '##.##.##', '########', '.#.##.#.', '#......#', '.#....#.',
  ]],
  a2: [[
    '..#.....#..', '...#...#...', '..#######..', '.##.###.##.', '###########', '#.#######.#', '#.#.....#.#', '...##.##...',
  ], [
    '..#.....#..', '#..#...#..#', '#.#######.#', '###.###.###', '###########', '.#########.', '..#.....#..', '.#.......#.',
  ]],
  a3: [[
    '....####....', '.##########.', '############', '###..##..###', '############', '...##..##...', '..##.##.##..', '##........##',
  ], [
    '....####....', '.##########.', '############', '###..##..###', '############', '..###..###..', '.##..##..##.', '..##....##..',
  ]],
  ship: [[
    '......#......', '.....###.....', '.....###.....', '.###########.', '#############', '#############', '#############', '#############',
  ]],
};

// ---------------------------------------------------------------------------
// Canvas / scaling
// ---------------------------------------------------------------------------
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let cssScale = 1, offX = 0, offY = 0, sx = 1, sy = 1;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  cssScale = Math.min(vw / W, vh / H);
  const cw = Math.floor(W * cssScale), ch = Math.floor(H * cssScale);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cvs.style.width = cw + 'px';
  cvs.style.height = ch + 'px';
  cvs.width = Math.max(1, Math.round(cw * dpr));
  cvs.height = Math.max(1, Math.round(ch * dpr));
  sx = cvs.width / W; sy = cvs.height / H;
  cssScale = cw / W;
  const r = cvs.getBoundingClientRect();
  offX = r.left; offY = r.top;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

function toGame(cx, cy) { return { x: (cx - offX) / cssScale, y: (cy - offY) / cssScale }; }

const spriteCache = {};
function sprite(name, frame, color) {
  const key = name + frame + color;
  let c = spriteCache[key];
  if (c) return c;
  const rows = SPR[name][frame];
  c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  g.fillStyle = color;
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === '#') g.fillRect(x, y, 1, 1); });
  spriteCache[key] = c;
  return c;
}

// ---------------------------------------------------------------------------
// Audio (Web Audio, created on first user gesture)
// ---------------------------------------------------------------------------
const Snd = {
  ctx: null, master: null, noiseBuf: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !paused) this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.35;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      // iOS unlock: play a silent buffer inside the gesture
      const s = this.ctx.createBufferSource();
      s.buffer = this.ctx.createBuffer(1, 1, 22050);
      s.connect(this.ctx.destination); s.start(0);
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.35;
    try { localStorage.setItem('siu-muted', m ? '1' : '0'); } catch (e) { /* storage unavailable */ }
  },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  ok() { return this.ctx && this.ctx.state === 'running' && !this.muted; },
  tone(freq, dur, type = 'square', vol = 0.2, slideTo = 0, delay = 0) {
    if (!this.ok()) return;
    const c = this.ctx, t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol = 0.3, freq = 1200, delay = 0) {
    if (!this.ok()) return;
    const c = this.ctx, t0 = c.currentTime + delay;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf;
    f.type = 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t0); s.stop(t0 + dur + 0.02);
  },
};
try { Snd.muted = localStorage.getItem('siu-muted') === '1'; } catch (e) { /* storage unavailable */ }

const SFX = {
  shoot()      { Snd.tone(880, 0.09, 'square', 0.12, 220); },
  alienShoot() { Snd.tone(320, 0.12, 'sawtooth', 0.05, 110); },
  alienDie()   { Snd.noise(0.16, 0.25, 1800); Snd.tone(220, 0.1, 'square', 0.08, 60); },
  clash()      { Snd.tone(1600, 0.05, 'square', 0.07, 900); },
  playerHit()  { Snd.noise(0.5, 0.4, 700); Snd.tone(160, 0.5, 'sawtooth', 0.2, 40); },
  march(i)     { Snd.tone([196, 185, 175, 165][i % 4], 0.07, 'square', 0.14); },
  strike()     { for (let i = 0; i < 4; i++) Snd.tone(i % 2 ? 2300 : 1900, 0.11, 'sine', 0.18, 0, i * 0.12); },
  violation()  { Snd.tone(110, 0.35, 'sawtooth', 0.22); Snd.tone(117, 0.35, 'sawtooth', 0.22); },
  rage()       { Snd.tone(70, 0.7, 'sawtooth', 0.3, 180); Snd.noise(0.6, 0.2, 400); },
  negotiate()  { [523, 659, 784, 1046].forEach((f, i) => Snd.tone(f, 0.14, 'triangle', 0.2, 0, i * 0.09)); },
  waveClear()  { [392, 523, 659, 784, 1046].forEach((f, i) => Snd.tone(f, 0.16, 'square', 0.1, 0, i * 0.08)); },
  victory()    { [523, 523, 523, 698, 880, 784, 1046].forEach((f, i) => Snd.tone(f, i === 6 ? 0.6 : 0.16, 'square', 0.12, 0, i * 0.14)); },
  gameOver()   { [392, 330, 262, 196].forEach((f, i) => Snd.tone(f, 0.35, 'sawtooth', 0.14, f * 0.9, i * 0.3)); },
  start()      { [262, 392, 523].forEach((f, i) => Snd.tone(f, 0.12, 'square', 0.12, 0, i * 0.08)); },
};

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => k * k * (3 - 2 * k);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const dist = (p, c) => Math.hypot(p.x - c.x, p.y - c.y);
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function wrap(str, maxW, size) {
  ctx.font = font(size);
  const words = str.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color, align = 'center', base = 'middle') {
  ctx.font = font(size);
  ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function makeSign(slogan) {
  const lines = wrap(slogan, 56, SIGN_FS);
  ctx.font = font(SIGN_FS);
  let mw = 0;
  for (const l of lines) mw = Math.max(mw, ctx.measureText(l).width);
  return { lines, w: Math.min(64, Math.ceil(mw) + 8), h: lines.length * 9 + 6 };
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let state = 'title';   // title | play | dying | gameover | victory
let paused = false;
let t = 0, endT = 0, deadT = 0, flashT = 0, shakeT = 0, shakeMag = 0;
let touchUI = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
let game, wave, player, pbullets = [], abullets = [], particles = [], popups = [];

const input = { left: false, right: false, fireKey: false, fireId: null, moveId: null, lastX: 0, dragDX: 0 };
function clearInput() { input.left = input.right = input.fireKey = false; input.fireId = input.moveId = null; input.dragDX = 0; }

const stars = [];
for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() < 0.2 ? 2 : 1, sp: 6 + Math.random() * 18, tw: Math.random() * 6 });

const titleSigns = ['WE WANT DENTAL', 'SOLIDARITY', 'FAIR WAGES FOR INVADERS'].map(makeSign);

function startGame() {
  game = { score: 0, lives: 3, violations: 0, honored: 0, strikes: 0, wavesCleared: 0, runTime: 0, invaded: false };
  player = { x: W / 2, cd: 0, inv: 0, alive: true };
  particles = []; popups = [];
  clearInput();
  paused = false;
  state = 'play';
  startWave(0);
  SFX.start();
}

function startWave(n) {
  const cfg = WAVES[n];
  wave = {
    n, cfg, aliens: [], total: cfg.cols * cfg.rows, anger: 0,
    phase: 'work', phaseT: 0, strikeViol: 0, struck: false, threshold: 0,
    fx: 0, fy: 96, dir: 1, fireT: 1.6, marchT: 0, marchI: 0, frame: 0,
    introT: 1.5, clearT: 0, bubbleLines: [], clearMsg: '',
  };
  // strike triggers when 40-60% of this wave's aliens remain
  wave.threshold = Math.round(wave.total * (0.4 + Math.random() * 0.2));
  wave.fx = (W - ((cfg.cols - 1) * CW + 24)) / 2;
  for (let r = 0; r < cfg.rows; r++) {
    const type = r === 0 ? 'a1' : r < cfg.rows - 1 ? 'a2' : 'a3';
    for (let c = 0; c < cfg.cols; c++) {
      wave.aliens.push({
        type, col: c, row: r, alive: true, x: 0, y: 0, gx: 0, gy: 0, px: 0, py: 0, fromX: 0, fromY: 0,
        sw: SPR[type][0][0].length * 2, pts: POINTS[type], seed: Math.random() * 10, sign: null,
      });
    }
  }
  layoutGrid();
  for (const a of wave.aliens) { a.x = a.gx; a.y = a.gy; }
  pbullets = []; abullets = [];
}

function layoutGrid() {
  for (const a of wave.aliens) { a.gx = wave.fx + a.col * CW; a.gy = wave.fy + a.row * CH; }
}

const aliveAliens = () => wave.aliens.filter((a) => a.alive);
const isStriking = () => wave.phase === 'strike_in' || wave.phase === 'picket' || wave.phase === 'negotiate';

function startStrike() {
  const w = wave;
  w.struck = true; w.phase = 'strike_in'; w.phaseT = 0; w.strikeViol = 0;
  game.strikes++;
  const alive = aliveAliens().sort((a, b) => a.row - b.row || a.col - b.col);
  const n = alive.length, perRow = 5;
  const slogans = shuffle(SLOGANS.slice());
  alive.forEach((a, i) => {
    const r = Math.floor(i / perRow);
    const inRow = Math.min(perRow, n - r * perRow);
    const k = i - r * perRow;
    a.px = W / 2 + (k - (inRow - 1) / 2) * 68 - 12;
    a.py = 190 + r * 70;
    a.fromX = a.x; a.fromY = a.y;
    a.sign = makeSign(slogans[i % slogans.length]);
  });
  // clear everything in flight so a shot fired just before the strike isn't a violation
  abullets.forEach((b) => (b.dead = true));
  pbullets.forEach((b) => (b.dead = true));
  player.cd = 0.5;
  popup(W / 2, 300, 'STRIKE!', '#ffe14d', 30, 1.4);
  SFX.strike();
}

function endStrike(rage) {
  const w = wave;
  if (!rage && w.strikeViol === 0) {
    game.honored++;
    popup(W / 2, 300, 'FAIR DEAL!', '#5cf2a0', 22, 1.3);
  }
  w.phase = 'strike_out'; w.phaseT = 0;
  layoutGrid();
  for (const a of aliveAliens()) { a.fromX = a.x; a.fromY = a.y; }
}

function wiggle(a, amt) {
  return {
    dx: Math.sin(t * 7 + a.seed) * 1.6 * amt,
    dy: -Math.abs(Math.sin(t * 9 + a.seed)) * 3 * amt,
    rot: Math.sin(t * 6 + a.seed) * 0.13 * amt,
  };
}

// ---------------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------------
function update(dt) {
  t += dt;
  for (const s of stars) { s.y += s.sp * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  if (paused) return;
  if (state === 'play' || state === 'dying') updatePlay(dt);
  if (state === 'gameover' || state === 'victory') endT += dt;

  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt; }
  particles = particles.filter((p) => p.life > 0);
  for (const p of popups) { p.y -= 22 * dt; p.life -= dt; }
  popups = popups.filter((p) => p.life > 0);
  if (flashT > 0) flashT -= dt;
  if (shakeT > 0) shakeT -= dt;
}

function updatePlay(dt) {
  const w = wave;
  game.runTime += dt;

  if (player.alive) {
    const mv = (input.left ? -1 : 0) + (input.right ? 1 : 0);
    player.x = clamp(player.x + mv * 240 * dt + input.dragDX * 1.6, 16, W - 16);
  }
  input.dragDX = 0;
  if (player.inv > 0) player.inv -= dt;
  player.cd -= dt;

  const wantFire = input.fireKey || input.fireId !== null;
  if (wantFire && player.alive && player.cd <= 0 && w.introT <= 0 && w.phase !== 'clear' && pbullets.length < 3) {
    pbullets.push({ x: player.x, y: PLAYER_Y - 6, dead: false });
    player.cd = 0.22;
    SFX.shoot();
  }

  for (const b of pbullets) b.y -= 560 * dt;
  for (const b of abullets) b.y += b.vy * dt;

  if (w.introT > 0) w.introT -= dt;
  else updateAliens(dt);

  collisions();
  pbullets = pbullets.filter((b) => !b.dead && b.y > -14);
  abullets = abullets.filter((b) => !b.dead && b.y < H + 10);

  if (w.phase === 'clear') {
    w.clearT -= dt;
    if (w.clearT <= 0 && state === 'play') {
      if (w.n + 1 < WAVES.length) startWave(w.n + 1);
      else endGame(true);
    }
  }
  if (state === 'dying') {
    deadT -= dt;
    if (deadT <= 0) endGame(false);
  }
}

function updateAliens(dt) {
  const w = wave;
  if (w.phase === 'clear') return;
  const alive = aliveAliens();
  if (!alive.length) return;

  if (w.phase === 'work') {
    const killedFrac = 1 - alive.length / w.total;
    const spd = w.cfg.speed * (1 + 1.8 * killedFrac) * (1 + 0.35 * w.anger);
    w.fx += w.dir * spd * dt;
    layoutGrid();
    let minX = Infinity, maxX = -Infinity;
    for (const a of alive) { minX = Math.min(minX, a.gx); maxX = Math.max(maxX, a.gx + 24); }
    if (w.dir > 0 && maxX > W - 8) { w.fx -= maxX - (W - 8); w.dir = -1; w.fy += 14; layoutGrid(); }
    else if (w.dir < 0 && minX < 8) { w.fx += 8 - minX; w.dir = 1; w.fy += 14; layoutGrid(); }
    let maxY = 0;
    for (const a of alive) { a.x = a.gx; a.y = a.gy; maxY = Math.max(maxY, a.y + 16); }

    w.marchT -= dt;
    if (w.marchT <= 0) {
      w.marchT = clamp(0.6 / (spd / 22), 0.09, 0.7);
      w.frame ^= 1;
      SFX.march(w.marchI++);
    }

    w.fireT -= dt;
    if (w.fireT <= 0 && player.alive) {
      alienFire(alive);
      w.fireT = (w.cfg.fire / (1 + 0.3 * w.anger)) * (0.6 + Math.random() * 0.8);
    }

    if (maxY >= PLAYER_Y - 2 && state === 'play') invaded();
    return;
  }

  // Strike choreography
  w.phaseT += dt;
  w.frame = Math.floor(t * 4) % 2;
  if (w.phase === 'strike_in') {
    const k = ease(Math.min(1, w.phaseT / TWEEN_TIME));
    for (const a of alive) {
      const wg = wiggle(a, k);
      a.x = lerp(a.fromX, a.px, k) + wg.dx;
      a.y = lerp(a.fromY, a.py, k) + wg.dy;
    }
    if (w.phaseT >= TWEEN_TIME) { w.phase = 'picket'; w.phaseT = 0; }
  } else if (w.phase === 'picket' || w.phase === 'negotiate') {
    const amt = w.phase === 'picket' ? 1 : 0.4;
    for (const a of alive) {
      const wg = wiggle(a, amt);
      a.x = a.px + wg.dx; a.y = a.py + wg.dy;
    }
    if (w.phase === 'picket' && w.phaseT >= PICKET_TIME) {
      w.phase = 'negotiate'; w.phaseT = 0;
      const msg = w.strikeViol > 0 ? pick(GRUDGES) : pick(DEALS);
      w.bubbleLines = wrap(msg, 268, 12);
      SFX.negotiate();
    } else if (w.phase === 'negotiate' && w.phaseT >= NEGOTIATE_TIME) {
      endStrike(false);
    }
  } else if (w.phase === 'strike_out') {
    const k = ease(Math.min(1, w.phaseT / TWEEN_TIME));
    for (const a of alive) { a.x = lerp(a.fromX, a.gx, k); a.y = lerp(a.fromY, a.gy, k); }
    if (w.phaseT >= TWEEN_TIME) { w.phase = 'work'; w.phaseT = 0; w.fireT = 0.9; }
  }
}

function alienFire(alive) {
  const cols = {};
  for (const a of alive) if (!cols[a.col] || a.row > cols[a.col].row) cols[a.col] = a;
  const shooters = Object.values(cols);
  let s;
  if (Math.random() < 0.45) {
    s = shooters.reduce((best, a) => (Math.abs(a.x + 12 - player.x) < Math.abs(best.x + 12 - player.x) ? a : best));
  } else s = pick(shooters);
  abullets.push({ x: s.x + 12, y: s.y + 16, vy: wave.cfg.bullet * (1 + 0.12 * wave.anger), dead: false });
  SFX.alienShoot();
}

function collisions() {
  const w = wave;
  for (const b of pbullets) {
    if (b.dead) continue;
    for (const ab of abullets) {
      if (!ab.dead && Math.abs(b.x - ab.x) < 4 && b.y < ab.y + 10 && b.y + 10 > ab.y) {
        b.dead = ab.dead = true;
        burst(b.x, b.y, '#ffffff', 6);
        SFX.clash();
        break;
      }
    }
    if (b.dead || w.phase === 'clear') continue;
    for (const a of w.aliens) {
      if (!a.alive) continue;
      const x0 = a.x + (24 - a.sw) / 2;
      if (b.x >= x0 - 1 && b.x <= x0 + a.sw + 1 && b.y < a.y + 16 && b.y + 10 > a.y) {
        b.dead = true;
        hitAlien(a);
        break;
      }
    }
  }
  if (!player.alive) return;
  for (const ab of abullets) {
    if (ab.dead) continue;
    if (player.inv <= 0 && ab.x > player.x - 12 && ab.x < player.x + 12 && ab.y + 10 > PLAYER_Y + 3 && ab.y < PLAYER_Y + 16) {
      ab.dead = true;
      playerHit();
      if (!player.alive) break;
    }
  }
}

function hitAlien(a) {
  const w = wave;
  a.alive = false;
  const cx = a.x + 12, cy = a.y + 8;
  const color = w.anger > 0 ? ANGRY[Math.min(w.anger, 3) - 1] : COLORS[a.type];
  burst(cx, cy, color, 16);

  if (isStriking()) {
    game.violations++; w.strikeViol++; w.anger++;
    popup(cx, cy - 26, 'UNION VIOLATION!', '#ff4d4d', 12, 1.1);
    flashT = 0.35; shake(0.3, 4);
    SFX.violation();
    if (a.sign) burst(cx, cy - 30, '#f4ecd8', 10);
  } else {
    game.score += a.pts;
    popup(cx, cy, '+' + a.pts, '#ffffff', 10, 0.7);
    SFX.alienDie();
  }

  const n = aliveAliens().length;
  if (n === 0) {
    w.phase = 'clear'; w.clearT = 1.6;
    game.wavesCleared++;
    w.clearMsg = w.anger > 0 ? 'HR IS "CONCERNED"' : 'NICE WORK, BOSS';
    abullets.forEach((b) => (b.dead = true));
    SFX.waveClear();
  } else if (isStriking() && w.strikeViol >= 3) {
    popup(W / 2, 300, 'WILDCAT RAGE!', '#ff2e2e', 24, 1.5);
    SFX.rage(); shake(0.6, 7);
    endStrike(true);
  } else if (!w.struck && w.phase === 'work' && n <= w.threshold) {
    startStrike();
  }
}

function playerHit() {
  game.lives--;
  burst(player.x, PLAYER_Y + 8, '#ffe14d', 34);
  SFX.playerHit(); shake(0.45, 6); flashT = 0.2;
  if (game.lives <= 0) {
    player.alive = false;
    state = 'dying'; deadT = 1.6;
  } else {
    player.inv = 1.8;
    abullets.forEach((b) => (b.dead = true));
  }
}

function invaded() {
  game.lives = 0; game.invaded = true;
  player.alive = false;
  burst(player.x, PLAYER_Y + 8, '#ffe14d', 40);
  popup(W / 2, 300, 'INVADED!', '#ff2e2e', 28, 1.5);
  SFX.playerHit(); shake(0.6, 8);
  state = 'dying'; deadT = 1.6;
}

function endGame(victory) {
  state = victory ? 'victory' : 'gameover';
  endT = 0; clearInput();
  const lrs = clamp(60 + game.honored * 15 - game.violations * 10, 0, 100);
  let grade, title, remark;
  if (lrs >= 95)      { grade = 'A+'; title = 'BELOVED OVERLORD';  remark = 'The aliens named a break room after you.'; }
  else if (lrs >= 80) { grade = 'A';  title = 'FAIR EMPLOYER';     remark = 'Glassdoor rating: 4.8 tentacles.'; }
  else if (lrs >= 65) { grade = 'B';  title = 'TOLERABLE BOSS';    remark = 'Nobody quit. Yet.'; }
  else if (lrs >= 50) { grade = 'C';  title = 'MIDDLE MANAGEMENT'; remark = game.strikes ? 'Mixed feedback in the exit interviews.' : 'No strikes witnessed. HR is suspicious.'; }
  else if (lrs >= 30) { grade = 'D';  title = 'UNION BUSTER';      remark = 'The aliens have hired a lawyer.'; }
  else                { grade = 'F';  title = 'GALACTIC LABOR CRIMINAL'; remark = 'You are now a cautionary tale in 40 galaxies.'; }
  game.end = {
    lrs, grade, title,
    remarkLines: wrap(remark, 300, 11),
    msgLines: wrap(victory ? pick(WIN_MSGS) : pick(LOSE_MSGS), 300, 14),
  };
  if (victory) SFX.victory(); else SFX.gameOver();
}

function burst(x, y, color, n) {
  for (let i = 0; i < n && particles.length < 400; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: 0.35 + Math.random() * 0.45, color, size: Math.random() < 0.3 ? 3 : 2 });
  }
}
function popup(x, y, str, color, size, life) { popups.push({ x, y, str, color, size, life, max: life }); }
function shake(dur, mag) { shakeMag = shakeT > 0 ? Math.max(shakeMag, mag) : mag; shakeT = Math.max(shakeT, dur); }

// ---------------------------------------------------------------------------
// Draw
// ---------------------------------------------------------------------------
function draw() {
  ctx.setTransform(sx, 0, 0, sy, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#07060f';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shakeT > 0 && !paused) ctx.translate((Math.random() - 0.5) * shakeMag, (Math.random() - 0.5) * shakeMag);

  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 2 + s.tw);
    ctx.fillStyle = '#c8c4ff';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  if (state === 'title') drawTitle();
  else drawGame();

  ctx.restore();

  if (flashT > 0) {
    ctx.strokeStyle = `rgba(255,40,40,${(flashT / 0.35) * 0.8})`;
    ctx.lineWidth = 8;
    ctx.strokeRect(4, 4, W - 8, H - 8);
  }
  if (state === 'gameover' || state === 'victory') drawEnd();
  if (paused) drawPaused();
}

function drawAlienSprite(type, frame, color, x, y) {
  const spr = sprite(type, frame, color);
  const sw = spr.width * 2;
  ctx.drawImage(spr, Math.round(x + (24 - sw) / 2), Math.round(y), sw, 16);
}

function drawSign(sign, cx, top, rot, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, top);
  ctx.rotate(rot);
  ctx.fillStyle = '#b07a3c';
  ctx.fillRect(-1, -11, 2, 12);
  const w = sign.w, h = sign.h, y0 = -11 - h;
  ctx.fillStyle = '#f4ecd8';
  ctx.fillRect(-w / 2, y0, w, h);
  ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 1;
  ctx.strokeRect(-w / 2 + 0.5, y0 + 0.5, w - 1, h - 1);
  ctx.fillStyle = '#c0262d';
  ctx.font = font(SIGN_FS);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  sign.lines.forEach((l, i) => ctx.fillText(l, 0, y0 + 3.5 + i * 9));
  ctx.restore();
}

function drawShip(x, y, scale = 2, color = '#ffe14d') {
  const spr = sprite('ship', 0, color);
  ctx.drawImage(spr, Math.round(x - (spr.width * scale) / 2), Math.round(y), spr.width * scale, spr.height * scale);
}

function drawTitle() {
  text('SPACE INVADERS', W / 2, 120, 30, '#ffffff');
  ctx.save();
  ctx.translate(W / 2, 175);
  ctx.rotate(-0.04);
  rr(-96, -30, 192, 60, 6);
  ctx.fillStyle = '#c0262d'; ctx.fill();
  text('UNION', 0, 2, 46, '#ffe14d');
  ctx.restore();
  text('LOCAL 1978 · INTERGALACTIC', W / 2, 228, 11, '#9d97c9');

  const types = ['a1', 'a2', 'a3'];
  for (let i = 0; i < 3; i++) {
    const a = { seed: i * 2.1 };
    const wg = wiggle(a, 1);
    const x = W / 2 + (i - 1) * 90 - 12 + wg.dx, y = 330 + wg.dy;
    drawSign(titleSigns[i], x + 12, y, wg.rot, 1);
    drawAlienSprite(types[i], Math.floor(t * 3) % 2, COLORS[types[i]], x, y);
  }

  text('Halfway through each wave,', W / 2, 390, 13, '#d8d4ff');
  text('the aliens go on STRIKE.', W / 2, 408, 13, '#ffe14d');
  text('Shoot strikers = UNION VIOLATION.', W / 2, 432, 12, '#ff8080');
  text('Wait it out and they negotiate.', W / 2, 450, 12, '#5cf2a0');

  if (touchUI) {
    text('DRAG bottom of screen to move', W / 2, 488, 12, '#9d97c9');
    text('HOLD the FIRE button to shoot', W / 2, 506, 12, '#9d97c9');
  } else {
    text('← → MOVE · SPACE FIRE · P PAUSE', W / 2, 496, 12, '#9d97c9');
  }

  if (Math.floor(t * 2) % 2 === 0) text(touchUI ? 'TAP TO START' : 'TAP OR PRESS SPACE', W / 2, 566, 20, '#ffffff');
  drawShip(W / 2, 600);
}

function drawGame() {
  const w = wave;
  const striking = isStriking();
  const angryCol = w.anger > 0 ? ANGRY[Math.min(w.anger, 3) - 1] : null;

  // signs (behind aliens), fading in/out with the tween
  if (w.phase !== 'work' && w.phase !== 'clear') {
    let alpha = 1;
    if (w.phase === 'strike_in') alpha = Math.min(1, w.phaseT / TWEEN_TIME);
    if (w.phase === 'strike_out') alpha = 1 - Math.min(1, w.phaseT / TWEEN_TIME);
    const amt = w.phase === 'picket' ? 1 : w.phase === 'negotiate' ? 0.4 : alpha;
    for (const a of w.aliens) {
      if (a.alive && a.sign) drawSign(a.sign, a.x + 12, a.y, wiggle(a, amt).rot, alpha);
    }
  }
  for (const a of w.aliens) {
    if (a.alive) drawAlienSprite(a.type, w.frame, angryCol || COLORS[a.type], a.x, a.y);
  }

  // bullets
  ctx.fillStyle = '#ffffff';
  for (const b of pbullets) ctx.fillRect(b.x - 1, b.y, 2, 10);
  ctx.fillStyle = angryCol || '#ff5e7a';
  const zig = Math.floor(t * 16) % 2;
  for (const b of abullets) {
    ctx.fillRect(b.x - 1 + (zig ? -1 : 1), b.y, 2, 3);
    ctx.fillRect(b.x - 1 + (zig ? 1 : -1), b.y + 3, 2, 3);
    ctx.fillRect(b.x - 1 + (zig ? -1 : 1), b.y + 6, 2, 3);
  }

  // player
  if (player.alive && !(player.inv > 0 && Math.floor(t * 12) % 2)) drawShip(player.x, PLAYER_Y);

  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // ground line
  ctx.fillStyle = '#2b2752';
  ctx.fillRect(0, PLAYER_Y + 22, W, 2);

  drawHUD();

  // strike banner + negotiation
  if (w.phase === 'strike_in' || w.phase === 'picket') {
    if (Math.floor(t * 3) % 2 === 0 || w.phase === 'picket') text('★ ON STRIKE · HOLD YOUR FIRE ★', W / 2, 60, 12, '#ffe14d');
    const k = w.phase === 'picket' ? w.phaseT / PICKET_TIME : 0;
    ctx.fillStyle = '#2b2752'; ctx.fillRect(60, 71, 240, 5);
    ctx.fillStyle = '#5cf2a0'; ctx.fillRect(60, 71, 240 * k, 5);
    text('NEGOTIATIONS', W / 2, 85, 9, '#9d97c9');
  } else if (w.phase === 'negotiate') {
    drawBubble();
  }

  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, (p.life / p.max) * 2);
    ctx.font = font(p.size);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = '#07060f';
    ctx.strokeText(p.str, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.str, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (w.introT > 0 && state === 'play') {
    const a = Math.min(1, w.introT * 2);
    ctx.globalAlpha = a;
    text('WAVE ' + (w.n + 1), W / 2, 300, 32, '#ffffff');
    text(w.cfg.name, W / 2, 334, 14, '#ffe14d');
    if (w.n === 0) text('Rumor has it they\'re unionizing...', W / 2, 362, 11, '#9d97c9');
    ctx.globalAlpha = 1;
  }
  if (w.phase === 'clear' && state === 'play') {
    text('SHIFT COMPLETE', W / 2, 300, 26, '#5cf2a0');
    text(w.clearMsg, W / 2, 330, 13, '#d8d4ff');
  }

  if (touchUI && (state === 'play' || state === 'dying')) drawTouchControls(striking);
}

function drawBubble() {
  const lines = wave.bubbleLines;
  const bw = 296, bh = (lines.length + 1) * 14 + 12, bx = (W - bw) / 2, by = 66;
  ctx.fillStyle = '#ffffff';
  rr(bx, by, bw, bh, 8); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W / 2 - 8, by + bh); ctx.lineTo(W / 2, by + bh + 9); ctx.lineTo(W / 2 + 8, by + bh);
  ctx.fill();
  text('UNION REP:', W / 2, by + 13, 11, '#c0262d');
  lines.forEach((l, i) => text(l, W / 2, by + 27 + i * 14, 12, '#1a1630'));
}

function drawHUD() {
  text('SCORE ' + String(game.score).padStart(5, '0'), 10, 20, 13, '#ffffff', 'left');
  text('WAVE ' + (wave.n + 1) + '/' + WAVES.length, 188, 20, 13, '#d8d4ff');
  for (let i = 0; i < game.lives; i++) drawShip(18 + i * 18, 34, 1);
  text('UNION VIOLATIONS: ' + game.violations, W - 10, 40, 11, game.violations ? '#ff4d4d' : '#9d97c9', 'right');

  // mute button
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.arc(MUTE_BTN.x, MUTE_BTN.y, 13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d8d4ff';
  ctx.beginPath();
  ctx.moveTo(MUTE_BTN.x - 7, MUTE_BTN.y - 3); ctx.lineTo(MUTE_BTN.x - 3, MUTE_BTN.y - 3);
  ctx.lineTo(MUTE_BTN.x + 2, MUTE_BTN.y - 7); ctx.lineTo(MUTE_BTN.x + 2, MUTE_BTN.y + 7);
  ctx.lineTo(MUTE_BTN.x - 3, MUTE_BTN.y + 3); ctx.lineTo(MUTE_BTN.x - 7, MUTE_BTN.y + 3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = Snd.muted ? '#ff4d4d' : '#d8d4ff'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (Snd.muted) {
    ctx.moveTo(MUTE_BTN.x + 4, MUTE_BTN.y - 4); ctx.lineTo(MUTE_BTN.x + 10, MUTE_BTN.y + 4);
    ctx.moveTo(MUTE_BTN.x + 10, MUTE_BTN.y - 4); ctx.lineTo(MUTE_BTN.x + 4, MUTE_BTN.y + 4);
  } else {
    ctx.arc(MUTE_BTN.x + 3, MUTE_BTN.y, 6, -0.9, 0.9);
  }
  ctx.stroke();

  // pause button
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.arc(PAUSE_BTN.x, PAUSE_BTN.y, 13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d8d4ff';
  ctx.fillRect(PAUSE_BTN.x - 5, PAUSE_BTN.y - 6, 3, 12);
  ctx.fillRect(PAUSE_BTN.x + 2, PAUSE_BTN.y - 6, 3, 12);
}

function drawTouchControls(striking) {
  // steering strip
  ctx.globalAlpha = input.moveId !== null ? 0.22 : 0.12;
  ctx.fillStyle = '#8f88ff';
  rr(12, 572, 248, 54, 12); ctx.fill();
  ctx.globalAlpha = 1;
  text('◀  DRAG TO MOVE  ▶', 136, 599, 12, 'rgba(216,212,255,0.6)');

  // fire button
  const pressed = input.fireId !== null;
  ctx.globalAlpha = pressed ? 0.85 : 0.55;
  ctx.fillStyle = striking ? '#c08a1a' : '#c0262d';
  ctx.beginPath(); ctx.arc(FIRE_BTN.x, FIRE_BTN.y, FIRE_BTN.r, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(FIRE_BTN.x, FIRE_BTN.y, FIRE_BTN.r - 3, 0, Math.PI * 2); ctx.stroke();
  text(striking ? 'FIRE?' : 'FIRE', FIRE_BTN.x, FIRE_BTN.y + 1, 15, '#ffffff');
}

function drawEnd() {
  const e = game.end, win = state === 'victory';
  ctx.fillStyle = 'rgba(7,6,15,0.86)';
  ctx.fillRect(0, 0, W, H);
  text(win ? 'VICTORY!' : 'GAME OVER', W / 2, 88, 34, win ? '#5cf2a0' : '#ff4d4d');
  e.msgLines.forEach((l, i) => text(l, W / 2, 132 + i * 19, 14, '#ffffff'));

  rr(30, 186, 300, 196, 10);
  ctx.fillStyle = '#16132e'; ctx.fill();
  ctx.strokeStyle = '#3d3878'; ctx.lineWidth = 2; ctx.stroke();
  text('LABOR RELATIONS SCORE', W / 2, 210, 13, '#9d97c9');
  text(String(e.lrs), W / 2 - 16, 258, 54, '#ffe14d');
  text('/100', W / 2 + 54, 270, 14, '#9d97c9');
  text(e.grade + ' · ' + e.title, W / 2, 310, e.title.length > 18 ? 13 : 16, '#ffffff');
  e.remarkLines.forEach((l, i) => text(l, W / 2, 340 + i * 15, 11, '#d8d4ff'));

  const rows = [
    ['SCORE', String(game.score)],
    ['SHIFTS COMPLETED', game.wavesCleared + '/' + WAVES.length],
    ['STRIKES HONORED', game.honored + '/' + game.strikes],
    ['UNION VIOLATIONS', String(game.violations)],
    ['SHIFT LENGTH', Math.round(game.runTime) + 's'],
  ];
  rows.forEach(([k, v], i) => {
    text(k, 52, 410 + i * 22, 12, '#9d97c9', 'left');
    text(v, W - 52, 410 + i * 22, 12, k === 'UNION VIOLATIONS' && game.violations ? '#ff4d4d' : '#ffffff', 'right');
  });

  const ready = endT > 0.8;
  ctx.globalAlpha = ready ? 1 : 0.4;
  rr(AGAIN_BTN.x, AGAIN_BTN.y, AGAIN_BTN.w, AGAIN_BTN.h, 10);
  ctx.fillStyle = '#c0262d'; ctx.fill();
  text('PLAY AGAIN', W / 2, AGAIN_BTN.y + AGAIN_BTN.h / 2 + 1, 20, '#ffe14d');
  ctx.globalAlpha = 1;
}

function drawPaused() {
  ctx.fillStyle = 'rgba(7,6,15,0.75)';
  ctx.fillRect(0, 0, W, H);
  text('PAUSED', W / 2, 290, 34, '#ffffff');
  text('Mandatory coffee break.', W / 2, 326, 13, '#ffe14d');
  text(touchUI ? 'TAP TO RESUME' : 'TAP OR PRESS P TO RESUME', W / 2, 372, 15, '#d8d4ff');
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
function pause() {
  if ((state === 'play' || state === 'dying') && !paused) { paused = true; clearInput(); Snd.suspend(); }
}
function resume() { if (paused) { paused = false; Snd.resume(); } }
function togglePause() { if (paused) resume(); else pause(); }

function onPointerDown(e) {
  e.preventDefault();
  if (window.focus) window.focus(); // keep keyboard focus inside the itch.io iframe
  Snd.init();
  if (e.pointerType === 'touch') touchUI = true;
  const p = toGame(e.clientX, e.clientY);

  if (state === 'title') { startGame(); return; }
  if (state === 'gameover' || state === 'victory') {
    if (endT > 0.8 && inRect(p, AGAIN_BTN)) startGame();
    return;
  }
  if (dist(p, PAUSE_BTN) < 24) { togglePause(); return; }
  if (dist(p, MUTE_BTN) < 20) { Snd.setMuted(!Snd.muted); return; }
  if (paused) { resume(); return; }

  if (touchUI && input.fireId === null && dist(p, FIRE_BTN) < FIRE_BTN.r + 14) { input.fireId = e.pointerId; return; }
  if (input.moveId === null && (p.y > ZONE_Y || e.clientY > window.innerHeight * 2 / 3)) {
    input.moveId = e.pointerId; input.lastX = p.x; return;
  }
  if (e.pointerType === 'mouse' && input.fireId === null) input.fireId = e.pointerId; // desktop: click above to fire
}
function onPointerMove(e) {
  if (e.pointerId === input.moveId) {
    e.preventDefault();
    const p = toGame(e.clientX, e.clientY);
    input.dragDX += p.x - input.lastX;
    input.lastX = p.x;
  }
}
function onPointerUp(e) {
  Snd.init();
  if (e.pointerId === input.moveId) input.moveId = null;
  if (e.pointerId === input.fireId) input.fireId = null;
}

window.addEventListener('pointerdown', onPointerDown, { passive: false });
window.addEventListener('pointermove', onPointerMove, { passive: false });
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);

// Block scrolling, pinch zoom, double-tap zoom, long-press menus
const block = (e) => e.preventDefault();
document.addEventListener('touchstart', block, { passive: false });
document.addEventListener('touchmove', block, { passive: false });
document.addEventListener('touchend', (e) => { e.preventDefault(); Snd.init(); }, { passive: false });
document.addEventListener('gesturestart', block, { passive: false });
document.addEventListener('dblclick', block, { passive: false });
document.addEventListener('contextmenu', block);

window.addEventListener('keydown', (e) => {
  Snd.init();
  const k = e.key;
  if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = true;
  if (k === 'm' || k === 'M') Snd.setMuted(!Snd.muted);
  if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); return; }
  if (k === ' ' || k === 'Enter' || k === 'ArrowUp') {
    if (e.repeat && state !== 'play') return;
    if (state === 'title') startGame();
    else if ((state === 'gameover' || state === 'victory') && endT > 0.8) startGame();
    else if (paused) resume();
    else if (k !== 'Enter') input.fireKey = true;
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
  if (k === ' ' || k === 'ArrowUp') input.fireKey = false;
});

document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', pause);

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); // clamp so tab switches don't teleport anything
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
